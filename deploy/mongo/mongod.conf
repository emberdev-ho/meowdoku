# Cấu hình mongod trên VPS: một node đơn lẻ, bắt buộc xác thực và TLS.
# setup.sh chép file này vào /etc/mongod.conf.

storage:
  dbPath: /var/lib/mongodb

systemLog:
  destination: file
  logAppend: true
  path: /var/log/mongodb/mongod.log

net:
  port: 27017
  # Vercel không có IP cố định nên phải nghe mọi địa chỉ. Khi app chuyển về chính VPS này,
  # đổi lại thành 127.0.0.1 và đóng cổng 27017 trên tường lửa.
  bindIp: 0.0.0.0
  tls:
    mode: requireTLS
    # fullchain + privkey của Let's Encrypt, do renew-hook.sh ghép lại.
    certificateKeyFile: /etc/mongodb/tls/mongod.pem
    # Client đăng nhập bằng mật khẩu, không cần chứng chỉ riêng.
    allowConnectionsWithoutCertificates: true
    disabledProtocols: TLS1_0,TLS1_1

security:
  authorization: enabled

setParameter:
  # mongod bắt buộc có CA khi bật TLS; dùng kho CA của hệ điều hành.
  tlsUseSystemCA: true

processManagement:
  timeZoneInfo: /usr/share/zoneinfo
